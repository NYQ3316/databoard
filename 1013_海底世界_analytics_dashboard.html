<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1013《海底世界》数据埋点统计看板</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            color: #e0e0e0;
            padding: 20px;
        }
        .container { max-width: 1400px; margin: 0 auto; }

        /* Header */
        .header {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 28px 32px;
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }
        .header .title h1 {
            font-size: 26px;
            color: #fff;
            margin-bottom: 6px;
        }
        .header .title .subtitle {
            font-size: 14px;
            color: #8892b0;
        }
        .header .stats {
            display: flex;
            gap: 24px;
        }
        .header .stats .item {
            text-align: center;
            padding: 8px 16px;
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
        }
        .header .stats .item .num {
            font-size: 22px;
            font-weight: 700;
            color: #64ffda;
        }
        .header .stats .item .label {
            font-size: 12px;
            color: #8892b0;
            margin-top: 2px;
        }
        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 16px;
            background: rgba(255,255,255,0.08);
            color: #8892b0;
            text-decoration: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s;
            white-space: nowrap;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .back-btn:hover {
            background: rgba(255,255,255,0.15);
            color: #ccd6f6;
        }

        /* Section */
        .section {
            background: rgba(255,255,255,0.04);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 20px;
        }
        .section-title {
            font-size: 17px;
            font-weight: 600;
            color: #ccd6f6;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .section-title .icon { font-size: 18px; }

        /* Chart grid */
        .chart-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
        }
        .chart-box {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 12px;
            padding: 16px;
        }
        .chart-box .chart-title {
            font-size: 14px;
            color: #8892b0;
            margin-bottom: 12px;
            text-align: center;
        }
        .chart-box canvas {
            max-height: 320px;
        }
        .chart-full {
            grid-column: 1 / -1;
        }

        /* Table */
        .data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        .data-table thead th {
            background: rgba(100,255,218,0.08);
            color: #64ffda;
            padding: 10px 12px;
            text-align: left;
            font-weight: 500;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .data-table tbody td {
            padding: 10px 12px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            color: #ccd6f6;
        }
        .data-table tbody tr:hover {
            background: rgba(255,255,255,0.03);
        }
        .data-table .rank {
            font-weight: 600;
            color: #64ffda;
            width: 40px;
        }
        .data-table .pct-bar {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .data-table .pct-bar .bar {
            height: 6px;
            border-radius: 3px;
            background: linear-gradient(90deg, #64ffda, #0a192f);
        }
        .data-table .pct-bar .val {
            font-size: 12px;
            color: #8892b0;
            min-width: 36px;
        }
        .data-table .highlight {
            color: #64ffda;
            font-weight: 600;
        }

        /* Flow table */
        .flow-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 12px;
        }
        .flow-item {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 10px;
            padding: 14px 16px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .flow-item .from, .flow-item .to {
            font-size: 13px;
            color: #ccd6f6;
            font-weight: 500;
            flex: 1;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .flow-item .arrow {
            color: #64ffda;
            font-size: 16px;
        }
        .flow-item .count {
            background: rgba(100,255,218,0.12);
            color: #64ffda;
            padding: 2px 10px;
            border-radius: 10px;
            font-size: 12px;
            font-weight: 600;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header { flex-direction: column; align-items: flex-start; }
            .header .stats { width: 100%; justify-content: space-between; }
            .chart-grid { grid-template-columns: 1fr; }
            .data-table { font-size: 12px; }
            .data-table thead th, .data-table tbody td { padding: 8px; }
        }
    </style>
</head>
<body>
<div class="container">
    <!-- Header -->
    <div class="header">
        <div class="title">
            <h1>🌊 海底世界（1013）数据埋点统计看板</h1>
            <div class="subtitle">数据来源：Alpha阶段反馈260113 · 20个模式 · 自由探索型产品</div>
        </div>
        <a class="back-btn" href="index.html">← 返回汇总看板</a>
        <div class="stats">
            <div class="item">
                <div class="num" id="totalSessions">0</div>
                <div class="label">总启动数</div>
            </div>
            <div class="item">
                <div class="num">20</div>
                <div class="label">游戏模式</div>
            </div>
            <div class="item">
                <div class="num" id="avgModesPerLaunch">0</div>
                <div class="label">平均单次启动体验模式数</div>
            </div>
            <div class="item">
                <div class="num" id="avgLaunchDuration">0</div>
                <div class="label">启动平均游玩时长</div>
            </div>
        </div>
    </div>

    <!-- 热门模式 -->
    <div class="section">
        <div class="section-title"><span class="icon">🔥</span> 热门模式</div>
        <div class="chart-grid">
            <div class="chart-box">
                <div class="chart-title">各模式体验次数占比</div>
                <canvas id="modePieChart"></canvas>
            </div>
            <div class="chart-box">
                <div class="chart-title">各模式体验次数排名</div>
                <canvas id="modeBarChart"></canvas>
            </div>
        </div>
    </div>

    <!-- 模式时长 -->
    <div class="section">
        <div class="section-title"><span class="icon">⏱️</span> 模式时长分析</div>
        <div class="chart-grid">
            <div class="chart-box chart-full">
                <div class="chart-title">各模式平均停留时长（秒）</div>
                <canvas id="durationBarChart"></canvas>
            </div>
            <div class="chart-box chart-full">
                <div class="chart-title">模式时长分段分布</div>
                <canvas id="durationDistChart"></canvas>
            </div>
        </div>
    </div>

    <!-- 启动分析 -->
    <div class="section">
        <div class="section-title"><span class="icon">🔄</span> 启动模式切换分析</div>
        <div class="chart-grid">
            <div class="chart-box">
                <div class="chart-title">启动内模式切换次数分布</div>
                <canvas id="switchDistChart"></canvas>
            </div>
            <div class="chart-box">
                <div class="chart-title">启动内体验模式数量分布</div>
                <canvas id="uniqueModeChart"></canvas>
            </div>
        </div>
    </div>

    <!-- 模式切换流向 -->
    <div class="section">
        <div class="section-title"><span class="icon">🌊</span> 模式切换流向 Top10</div>
        <div class="flow-grid" id="flowGrid"></div>
    </div>

    <!-- 详细数据 -->
    <div class="section">
        <div class="section-title"><span class="icon">📊</span> 模式详细数据</div>
        <div style="overflow-x:auto;">
            <table class="data-table" id="detailTable">
                <thead>
                    <tr>
                        <th>排名</th>
                        <th>模式ID</th>
                        <th>模式名称</th>
                        <th>体验次数</th>
                        <th>占比</th>
                        <th>平均时长</th>
                        <th>中位时长</th>
                        <th>总时长(分钟)</th>
                    </tr>
                </thead>
                <tbody id="detailTableBody"></tbody>
            </table>
        </div>
    </div>
</div>

<script>
// ========== 模式定义（20个模式，以Alpha反馈为准）==========
const MODES = [
    { id: 'mode_01', name: '镜子', color: '#64ffda' },
    { id: 'mode_02', name: '宝箱模式', color: '#ffd700' },
    { id: 'mode_03', name: '章鱼喷墨', color: '#ff6b6b' },
    { id: 'mode_04', name: '软软生物', color: '#4ecdc4' },
    { id: 'mode_05', name: '影分身', color: '#a29bfe' },
    { id: 'mode_06', name: '四面镜', color: '#fd79a8' },
    { id: 'mode_07', name: '空间切割', color: '#00b894' },
    { id: 'mode_08', name: '鱼群旋涡', color: '#0984e3' },
    { id: 'mode_09', name: '水母乐园', color: '#e17055' },
    { id: 'mode_10', name: '竖扭/横卷海潮', color: '#6c5ce7' },
    { id: 'mode_11', name: '海底机器人', color: '#2d3436' },
    { id: 'mode_12', name: '砸蛋蛋', color: '#fab1a0' },
    { id: 'mode_13', name: '哈哈镜', color: '#74b9ff' },
    { id: 'mode_14', name: '蛋仔', color: '#ffeaa7' },
    { id: 'mode_15', name: '泡泡浴', color: '#dfe6e9' },
    { id: 'mode_16', name: '魔鬼鱼', color: '#636e72' },
    { id: 'mode_17', name: '魔法世界', color: '#e84393' },
    { id: 'mode_18', name: '海底健身', color: '#00cec9' },
    { id: 'mode_19', name: '海底基建', color: '#b2bec3' },
    { id: 'mode_20', name: '海底照相馆', color: '#fdcb6e' }
];

// ========== 模拟数据生成 ==========
function generateData() {
    const totalSessions = 5000;
    const experiences = [];
    let totalExp = 0;

    // 各模式体验次数（模拟不同热度）
    const experienceCounts = [420, 380, 520, 450, 310, 280, 340, 490, 360, 290, 250, 410, 330, 470, 390, 270, 440, 300, 220, 460];

    // 各模式平均时长（秒）
    const avgDurations = [35, 55, 68, 45, 40, 32, 38, 72, 50, 36, 85, 58, 30, 42, 48, 52, 75, 60, 90, 44];

    MODES.forEach((mode, i) => {
        const count = experienceCounts[i];
        const avgDur = avgDurations[i];
        totalExp += count;
        experiences.push({
            ...mode,
            count: count,
            avgDuration: avgDur,
            medianDuration: Math.round(avgDur * (0.7 + Math.random() * 0.4)),
            pct: 0 // 稍后计算
        });
    });

    // 计算占比
    experiences.forEach(e => { e.pct = (e.count / totalExp * 100).toFixed(2); });

    // 按次数排序
    experiences.sort((a, b) => b.count - a.count);

    // 时长分布数据（6个时间段 x 20个模式）
    const durationRanges = ['0-10秒', '10-30秒', '30-60秒', '1-2分钟', '2-5分钟', '5分钟+'];
    const durationDist = durationRanges.map((range, ri) => {
        return {
            label: range,
            data: experiences.map((e, mi) => {
                const avg = avgDurations[MODES.findIndex(m => m.id === e.id)];
                // 根据平均时长模拟分布
                let base;
                if (ri === 0) base = Math.max(5, 30 - avg * 0.4);
                else if (ri === 1) base = Math.max(10, 40 - Math.abs(avg - 25) * 0.5);
                else if (ri === 2) base = Math.max(8, 35 - Math.abs(avg - 45) * 0.3);
                else if (ri === 3) base = Math.max(5, 20 - Math.abs(avg - 70) * 0.2);
                else if (ri === 4) base = Math.max(2, avg > 60 ? avg * 0.15 : 3);
                else base = Math.max(1, avg > 80 ? avg * 0.08 : 1);
                return Math.round(base + Math.random() * 8);
            })
        };
    });

    // 切换次数分布（1-15次）
    const switchDist = [280, 450, 620, 780, 850, 720, 540, 380, 250, 180, 120, 80, 50, 30, 20];

    // 体验模式数量分布（1-10个）
    const uniqueModeDist = [150, 280, 420, 580, 720, 850, 780, 620, 380, 220];

    // 模式切换流向 Top10（模拟）
    const flows = [
        { from: '镜子', to: '章鱼喷墨', count: 320 },
        { from: '章鱼喷墨', to: '软软生物', count: 280 },
        { from: '鱼群旋涡', to: '水母乐园', count: 260 },
        { from: '魔法世界', to: '镜子', count: 240 },
        { from: '软软生物', to: '影分身', count: 220 },
        { from: '泡泡浴', to: '蛋仔', count: 210 },
        { from: '镜子', to: '鱼群旋涡', count: 200 },
        { from: '影分身', to: '四面镜', count: 190 },
        { from: '砸蛋蛋', to: '魔鬼鱼', count: 180 },
        { from: '海底照相馆', to: '泡泡浴', count: 170 }
    ];

    // 计算总时长（分钟）
    experiences.forEach(e => {
        e.totalDurationMin = ((e.count * e.avgDuration) / 60).toFixed(1);
    });

    return {
        totalSessions,
        totalExp,
        experiences,
        durationDist,
        durationRanges,
        switchDist,
        uniqueModeDist,
        flows,
        avgSessionDuration: Math.round(totalExp * 50 / totalSessions) // 模拟平均启动时长
    };
}

const data = generateData();

// ========== 更新Header统计 ==========
document.getElementById('totalSessions').textContent = data.totalSessions.toLocaleString();
document.getElementById('avgModesPerLaunch').textContent = (data.totalExp / data.totalSessions).toFixed(1);
document.getElementById('avgLaunchDuration').textContent = data.avgSessionDuration + 's';

// ========== Chart.js 默认配置 ==========
Chart.defaults.color = '#8892b0';
Chart.defaults.borderColor = 'rgba(255,255,255,0.08)';
Chart.defaults.font.family = "-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif";

// ========== 热门模式 - 饼图 ==========
const top10 = data.experiences.slice(0, 10);
const othersCount = data.experiences.slice(10).reduce((s, e) => s + e.count, 0);
const pieLabels = top10.map(e => e.name);
const pieData = top10.map(e => e.count);
if (othersCount > 0) {
    pieLabels.push('其他模式');
    pieData.push(othersCount);
}

new Chart(document.getElementById('modePieChart'), {
    type: 'pie',
    data: {
        labels: pieLabels,
        datasets: [{
            data: pieData,
            backgroundColor: [
                '#64ffda', '#ffd700', '#ff6b6b', '#4ecdc4', '#a29bfe',
                '#fd79a8', '#00b894', '#0984e3', '#e17055', '#6c5ce7', '#b2bec3'
            ],
            borderWidth: 0
        }]
    },
    options: {
        responsive: true,
        maintainAspectRatio: true,
        plugins: {
            legend: { position: 'right', labels: { boxWidth: 14, padding: 12 } },
            tooltip: {
                callbacks: {
                    label: function(ctx) {
                        const total = ctx.dataset.data.reduce((a, b) => a + b, 0);
                        const pct = (ctx.raw / total * 100).toFixed(1);
                        return `${ctx.label}: ${ctx.raw}次 (${pct}%)`;
                    }
                }
            }
        }
    }
});

// ========== 热门模式 - 柱状图 ==========
new Chart(document.getElementById('modeBarChart'), {
    type: 'bar',
    data: {
        labels: data.experiences.map(e => e.name),
        datasets: [{
            label: '体验次数',
            data: data.experiences.map(e => e.count),
            backgroundColor: data.experiences.map(e => e.color + 'cc'),
            borderColor: data.experiences.map(e => e.color),
            borderWidth: 1,
            borderRadius: 4
        }]
    },
    options: {
        responsive: true,
        maintainAspectRatio: true,
        plugins: { legend: { display: false } },
        scales: {
            x: { ticks: { font: { size: 11 }, maxRotation: 45 } },
            y: { beginAtZero: true, grid: { color: 'rgba(255,255,255,0.05)' } }
        }
    }
});

// ========== 模式平均时长 - 柱状图 ==========
new Chart(document.getElementById('durationBarChart'), {
    type: 'bar',
    data: {
        labels: data.experiences.map(e => e.name),
        datasets: [{
            label: '平均停留时长（秒）',
            data: data.experiences.map(e => e.avgDuration),
            backgroundColor: 'rgba(100,255,218,0.6)',
            borderColor: '#64ffda',
            borderWidth: 1,
            borderRadius: 4
        }]
    },
    options: {
        responsive: true,
        maintainAspectRatio: true,
        plugins: { legend: { display: false } },
        scales: {
            x: { ticks: { font: { size: 11 }, maxRotation: 45 } },
            y: { beginAtZero: true, grid: { color: 'rgba(255,255,255,0.05)' }, title: { display: true, text: '秒' } }
        }
    }
});

// ========== 模式时长分布 - 堆叠柱状图 ==========
new Chart(document.getElementById('durationDistChart'), {
    type: 'bar',
    data: {
        labels: data.experiences.map(e => e.name),
        datasets: data.durationDist.map((d, i) => ({
            label: d.label,
            data: d.data,
            backgroundColor: [
                'rgba(255,107,107,0.7)', 'rgba(253,121,168,0.7)', 'rgba(100,255,218,0.7)',
                'rgba(116,185,255,0.7)', 'rgba(253,203,110,0.7)', 'rgba(108,92,231,0.7)'
            ][i],
            borderRadius: 2
        }))
    },
    options: {
        responsive: true,
        maintainAspectRatio: true,
        plugins: { legend: { position: 'top', labels: { boxWidth: 12, padding: 10 } } },
        scales: {
            x: { stacked: true, ticks: { font: { size: 11 }, maxRotation: 45 } },
            y: { stacked: true, beginAtZero: true, grid: { color: 'rgba(255,255,255,0.05)' }, title: { display: true, text: '体验次数' } }
        }
    }
});

// ========== 启动切换次数分布 ==========
new Chart(document.getElementById('switchDistChart'), {
    type: 'line',
    data: {
        labels: ['1次', '2次', '3次', '4次', '5次', '6次', '7次', '8次', '9次', '10次', '11次', '12次', '13次', '14次', '15次'],
        datasets: [{
            label: '启动数',
            data: data.switchDist,
            borderColor: '#64ffda',
            backgroundColor: 'rgba(100,255,218,0.1)',
            borderWidth: 2,
            pointBackgroundColor: '#64ffda',
            pointRadius: 4,
            fill: true,
            tension: 0.3
        }]
    },
    options: {
        responsive: true,
        maintainAspectRatio: true,
        plugins: { legend: { display: false } },
        scales: {
            x: { grid: { display: false } },
            y: { beginAtZero: true, grid: { color: 'rgba(255,255,255,0.05)' }, title: { display: true, text: '启动数' } }
        }
    }
});

// ========== 体验模式数量分布 ==========
new Chart(document.getElementById('uniqueModeChart'), {
    type: 'bar',
    data: {
        labels: ['1个', '2个', '3个', '4个', '5个', '6个', '7个', '8个', '9个', '10个+'],
        datasets: [{
            label: '启动数',
            data: data.uniqueModeDist,
            backgroundColor: 'rgba(253,121,168,0.6)',
            borderColor: '#fd79a8',
            borderWidth: 1,
            borderRadius: 4
        }]
    },
    options: {
        responsive: true,
        maintainAspectRatio: true,
        plugins: { legend: { display: false } },
        scales: {
            x: { grid: { display: false } },
            y: { beginAtZero: true, grid: { color: 'rgba(255,255,255,0.05)' }, title: { display: true, text: '启动数' } }
        }
    }
});

// ========== 模式切换流向 ==========
const flowGrid = document.getElementById('flowGrid');
data.flows.forEach(f => {
    const div = document.createElement('div');
    div.className = 'flow-item';
    div.innerHTML = `
        <div class="from">${f.from}</div>
        <div class="arrow">→</div>
        <div class="to">${f.to}</div>
        <div class="count">${f.count}次</div>
    `;
    flowGrid.appendChild(div);
});

// ========== 详细数据表格 ==========
const tbody = document.getElementById('detailTableBody');
data.experiences.forEach((e, i) => {
    const tr = document.createElement('tr');
    const maxCount = data.experiences[0].count;
    const barWidth = Math.round((e.count / maxCount) * 100);
    tr.innerHTML = `
        <td class="rank">${i + 1}</td>
        <td>${e.id}</td>
        <td><strong>${e.name}</strong></td>
        <td class="highlight">${e.count.toLocaleString()}</td>
        <td>
            <div class="pct-bar">
                <div class="bar" style="width:${barWidth}%"></div>
                <div class="val">${e.pct}%</div>
            </div>
        </td>
        <td class="highlight">${e.avgDuration}s</td>
        <td>${e.medianDuration}s</td>
        <td>${e.totalDurationMin}</td>
    `;
    tbody.appendChild(tr);
});
</script>
</body>
</html>
