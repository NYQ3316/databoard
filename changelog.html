<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>更新记录 - 埋点命名规范</title>
    <!--
      维护说明（每次更新后追加一条，最新的一条放在最上面）：
      1. 先用代码检测本次改动，例如：
         git -C <repo> diff --numstat            # 改动文件与增删行数
         git -C <repo> diff -- <file>            # 具体内容差异（新增/删除的字段、事件行等）
      2. 依据检测结果归纳 1~3 条要点（不要凭印象描述）；
      3. 在下方 timeline 区块内的最前面插入一条 entry 卡片；
      4. 日期取更新当天（YYYY-MM-DD），同一天多次更新可合并为一条或并列多条。
    -->
    <style>
        /* ======== 主题变量：浅色为默认；深色多套方案通过 html[data-theme] 切换 ======== */
        :root {
            --bg:#f8fafc; --card:#ffffff; --border:#e2e8f0; --text:#1a1a2e; --text-strong:#1a1a2e; --text-muted:#666;
            --hover:#fafafa; --accent:#667eea; --accent-soft:#e0f2fe; --accent-text:#0c4a6e;
            --badge-bg:#22c55e; --badge-text:#ffffff;
            --header-bg:linear-gradient(135deg,#667eea 0%,#764ba2 100%); --header-text:#ffffff;
            --shadow:0 2px 10px rgba(0,0,0,0.06);
        }
        html[data-theme="zinc"] {
            --bg:#18181b; --card:#27272a; --border:#3f3f46; --text:#e4e4e7; --text-strong:#fafafa; --text-muted:#a1a1aa; --hover:#323238; --accent:#60a5fa; --accent-soft:transparent; --accent-text:#a5b4fc; --badge-bg:rgba(74,222,128,0.15); --badge-text:#86efac; --header-bg:linear-gradient(135deg,#52525b 0%,#3f3f46 100%); --header-text:#fafafa; --shadow:0 2px 10px rgba(0,0,0,0.45);
        }
        html[data-theme="navy"] {
            --bg:#0b1220; --card:#131c31; --border:#1e293b; --text:#cbd5e1; --text-strong:#f1f5f9; --text-muted:#94a3b8; --hover:#1e293b; --accent:#60a5fa; --accent-soft:transparent; --accent-text:#93c5fd; --badge-bg:rgba(74,222,128,0.15); --badge-text:#86efac; --header-bg:linear-gradient(135deg,#1e3a8a 0%,#312e81 100%); --header-text:#f8fafc; --shadow:0 2px 10px rgba(0,0,0,0.45);
        }
        html[data-theme="warm"] {
            --bg:#1c1917; --card:#292524; --border:#44403c; --text:#e7e5e4; --text-strong:#fafaf9; --text-muted:#a8a29e; --hover:#3f3a36; --accent:#fb923c; --accent-soft:transparent; --accent-text:#fdba74; --badge-bg:rgba(74,222,128,0.15); --badge-text:#86efac; --header-bg:linear-gradient(135deg,#57534e 0%,#44403c 100%); --header-text:#fafaf9; --shadow:0 2px 10px rgba(0,0,0,0.45);
        }
        html[data-theme="oled"] {
            --bg:#000000; --card:#111111; --border:#262626; --text:#f5f5f5; --text-strong:#ffffff; --text-muted:#a3a3a3; --hover:#1f1f1f; --accent:#60a5fa; --accent-soft:transparent; --accent-text:#93c5fd; --badge-bg:rgba(74,222,128,0.15); --badge-text:#86efac; --header-bg:linear-gradient(135deg,#1a1a1a 0%,#0a0a0a 100%); --header-text:#ffffff; --shadow:0 2px 10px rgba(0,0,0,0.45);
        }
        html[data-theme="slate"] {
            --bg:#0f172a; --card:#1e293b; --border:#334155; --text:#cbd5e1; --text-strong:#f1f5f9; --text-muted:#94a3b8; --hover:#273449; --accent:#60a5fa; --accent-soft:transparent; --accent-text:#93c5fd; --badge-bg:rgba(74,222,128,0.15); --badge-text:#86efac; --header-bg:linear-gradient(135deg,#334155 0%,#1e293b 100%); --header-text:#f8fafc; --shadow:0 2px 10px rgba(0,0,0,0.45);
        }
        /* 未手动选择时：跟随系统，深色默认用「深蓝夜空 navy」 */
        @media (prefers-color-scheme: dark) {
            html:not([data-theme]) {
                --bg:#0b1220; --card:#131c31; --border:#1e293b; --text:#cbd5e1; --text-strong:#f1f5f9; --text-muted:#94a3b8; --hover:#1e293b; --accent:#60a5fa; --accent-soft:transparent; --accent-text:#93c5fd; --badge-bg:rgba(74,222,128,0.15); --badge-text:#86efac; --header-bg:linear-gradient(135deg,#1e3a8a 0%,#312e81 100%); --header-text:#f8fafc; --shadow:0 2px 10px rgba(0,0,0,0.45);
            }
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 960px; margin: 0 auto; }

        /* Header */
        .header {
            background: var(--header-bg);
            border-radius: 16px;
            padding: 32px;
            margin-bottom: 24px;
            color: var(--header-text);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }
        .header h1 { font-size: 26px; margin-bottom: 6px; }
        .header .subtitle { opacity: 0.85; font-size: 14px; }
        .header-actions { display: flex; gap: 10px; flex-wrap: wrap; }
        .back-btn {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 10px 20px; background: rgba(255,255,255,0.2);
            color: var(--header-text); text-decoration: none; border-radius: 8px;
            font-size: 14px; font-weight: 500; transition: all 0.3s; white-space: nowrap;
        }
        .back-btn:hover { background: rgba(255,255,255,0.3); }

        /* Timeline */
        .timeline { position: relative; padding-left: 26px; }
        .timeline::before {
            content: ''; position: absolute; left: 7px; top: 8px; bottom: 8px;
            width: 2px; background: var(--border);
        }
        .entry {
            position: relative;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 18px 20px;
            margin-bottom: 16px;
            box-shadow: var(--shadow);
        }
        .entry::before {
            content: ''; position: absolute; left: -24px; top: 24px;
            width: 10px; height: 10px; border-radius: 50%;
            background: var(--accent); border: 2px solid var(--card);
        }
        .entry-head {
            display: flex; align-items: center; gap: 10px;
            flex-wrap: wrap; margin-bottom: 10px;
        }
        .entry-date {
            font-family: 'SF Mono', Monaco, monospace;
            font-size: 13px; font-weight: 600;
            color: var(--accent-text); background: var(--accent-soft);
            padding: 3px 10px; border-radius: 8px;
        }
        .entry-tag {
            font-size: 12px; padding: 3px 10px; border-radius: 12px;
            background: var(--hover); color: var(--text-muted);
            border: 1px solid var(--border);
        }
        .entry-list { margin: 0; padding-left: 20px; }
        .entry-list li { font-size: 14px; line-height: 1.9; color: var(--text); }
        .entry-list li + li { margin-top: 2px; }
        code {
            font-family: 'SF Mono', Monaco, monospace; font-size: 12.5px;
            background: var(--accent-soft); color: var(--accent-text);
            padding: 1px 6px; border-radius: 5px;
        }
        .footer {
            text-align: center; font-size: 12px; color: var(--text-muted);
            padding: 8px 0 24px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div>
                <h1>📝 更新记录</h1>
                <div class="subtitle">埋点命名规范 / 看板 的历次更新梗概（最新在最上）</div>
            </div>
            <div class="header-actions">
                <a class="back-btn" href="naming_standards.html">&larr; 返回命名规范</a>
                <a class="back-btn" href="index.html">&larr; 返回看板总览</a>
            </div>
        </div>

        <!-- 更新记录列表：新增条目请插入到 timeline 的最前面 -->
        <div class="timeline">

            <article class="entry">
                <div class="entry-head">
                    <span class="entry-date">2026-09-10</span>
                    <span class="entry-tag">页面结构</span>
                </div>
                <ul class="entry-list">
                    <li>新增本页 <code>changelog.html</code>，按时间倒序记录每次更新的梗概，并附维护说明（先检测 diff，再归纳条目）。</li>
                    <li><code>naming_standards.html</code> 页头与悬浮目录各新增一个「📝 更新记录」入口，可跳转至本页。</li>
                    <li>更新流程固定为：同步改动到仓库 → 用 <code>git diff</code> 检测本次改动 → 在本页最前面追加一条记录 → 提交推送。</li>
                </ul>
            </article>

        </div>

        <div class="footer">共 <span id="entryCount">1</span> 条更新记录</div>
    </div>
    <script>
    (function () {
        var el = document.getElementById('entryCount');
        if (el) el.textContent = document.querySelectorAll('.entry').length;
    })();
    </script>
</body>
</html>
