<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>1021《动物指挥家》数据埋点统计看板</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        .container { max-width: 1400px; margin: 0 auto; }
        .header {
            background: rgba(255,255,255,0.95);
            border-radius: 16px;
            padding: 24px 32px;
            margin-bottom: 24px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }
        .header h1 { font-size: 26px; color: #1a1a2e; }
        .header .subtitle { color: #666; font-size: 14px; margin-top: 6px; }
        .back-btn {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 8px 16px; background: rgba(0,0,0,0.05);
            color: #666; text-decoration: none; border-radius: 8px;
            font-size: 14px; font-weight: 500; transition: all 0.3s; white-space: nowrap;
        }
        .back-btn:hover { background: rgba(0,0,0,0.1); color: #333; }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 24px;
        }
        .stat-card {
            background: rgba(255,255,255,0.95);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        .stat-card .label { font-size: 14px; color: #666; margin-bottom: 8px; }
        .stat-card .value { font-size: 32px; font-weight: 700; color: #1a1a2e; }
        .charts-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
            margin-bottom: 24px;
        }
        .chart-card {
            background: rgba(255,255,255,0.95);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        .chart-card h3 {
            font-size: 18px; color: #1a1a2e; margin-bottom: 20px;
            padding-bottom: 12px; border-bottom: 2px solid #f0f0f0;
        }
        .table-card {
            background: rgba(255,255,255,0.95);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            margin-bottom: 24px;
        }
        .table-card h3 {
            font-size: 18px; color: #1a1a2e; margin-bottom: 20px;
            padding-bottom: 12px; border-bottom: 2px solid #f0f0f0;
        }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px 16px; text-align: left; border-bottom: 1px solid #f0f0f0; }
        th { font-weight: 600; color: #666; font-size: 13px; }
        td { color: #333; font-size: 14px; }
        tr:hover { background: #fafafa; }
        .footer { text-align: center; color: rgba(255,255,255,0.7); font-size: 13px; margin-top: 40px; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div>
            <h1>🎼 动物指挥家 - 数据埋点统计看板</h1>
            <div class="subtitle">项目编号：1021 | 埋点偏向：热门歌曲、乐队人数 | 支持人数：1人</div>
        </div>
        <a class="back-btn" href="../index.html">&larr; 返回汇总看板</a>
    </div>
    
    <div class="stats-grid">
        <div class="stat-card">
            <div class="label">总体验次数</div>
            <div class="value">500</div>
        </div>
        <div class="stat-card">
            <div class="label">游戏模式数</div>
            <div class="value">1</div>
        </div>
        <div class="stat-card">
            <div class="label">平均得分</div>
            <div class="value">8,420</div>
        </div>
        <div class="stat-card">
            <div class="label">活跃玩家</div>
            <div class="value">3,256</div>
        </div>
    </div>
    
    <div class="charts-grid">
        <div class="chart-card">
            <h3>🔥 热门模式分布</h3>
            <canvas id="modePieChart"></canvas>
        </div>
        <div class="chart-card">
            <h3>📊 各模式体验次数</h3>
            <canvas id="modeBarChart"></canvas>
        </div>
    </div>
    
    <div class="table-card">
        <h3>📋 模式详细数据</h3>
        <table>
            <thead>
                <tr><th>排名</th><th>模式</th><th>体验次数</th><th>占比</th><th>平均得分</th></tr>
            </thead>
            <tbody>
                <tr><td>1</td><td>指挥模式</td><td>500</td><td>100.0%</td><td>8,000</td></tr>
            </tbody>
        </table>
    </div>
    
    <div class="footer">
        <p>游戏数据埋点统计看板 | 本地 Git 仓库管理</p>
    </div>
</div>

<script>
Chart.defaults.font.family = "-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif";

const modes = ["指挥模式"];
const counts = [500];
const colors = ["#64ffda"];

new Chart(document.getElementById('modePieChart'), {
    type: 'pie',
    data: {
        labels: modes,
        datasets: [{ data: counts, backgroundColor: colors, borderWidth: 0 }]
    },
    options: { responsive: true, plugins: { legend: { position: 'right' } } }
});

new Chart(document.getElementById('modeBarChart'), {
    type: 'bar',
    data: {
        labels: modes,
        datasets: [{ label: '体验次数', data: counts, backgroundColor: colors.map(c => c + 'cc'), borderRadius: 4 }]
    },
    options: { responsive: true, plugins: { legend: { display: false } }, scales: { y: { beginAtZero: true } } }
});
</script>
</body>
</html>
